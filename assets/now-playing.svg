<svg xmlns="http://www.w3.org/2000/svg" width="820" height="116" viewBox="0 0 820 116">
  <defs>
    <clipPath id="album-clip">
      <rect x="18" y="18" width="80" height="80" rx="10" />
    </clipPath>
    <linearGradient id="cover-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#163042" />
    </linearGradient>
    <linearGradient id="eq-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#57da69" />
      <stop offset="100%" stop-color="#8ECAE6" />
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#57da69" />
      <stop offset="65%" stop-color="#8ECAE6" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes eqA {
      0%, 100% { transform: scaleY(0.18); }
      50% { transform: scaleY(0.95); }
    }
    @keyframes eqB {
      0%, 100% { transform: scaleY(0.75); }
      45% { transform: scaleY(0.2); }
      80% { transform: scaleY(0.9); }
    }
    @keyframes eqC {
      0%, 100% { transform: scaleY(0.3); }
      35% { transform: scaleY(0.85); }
      70% { transform: scaleY(0.15); }
    }
    @keyframes progress {
      0% { transform: scaleX(0.08); }
      100% { transform: scaleX(0.96); }
    }

    .vinyl { animation: spin 7s linear infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    .prog { animation: progress 26s linear infinite; }

    .b1 { animation: eqA 1.1s ease-in-out infinite; }
    .b2 { animation: eqB 0.9s ease-in-out infinite 0.1s; }
    .b3 { animation: eqC 1.3s ease-in-out infinite 0.2s; }
    .b4 { animation: eqA 0.85s ease-in-out infinite 0.3s; }
    .b5 { animation: eqB 1.2s ease-in-out infinite 0.05s; }
    .b6 { animation: eqC 0.95s ease-in-out infinite 0.25s; }

    .meta { font-family: "Fira Code", "Ubuntu Mono", monospace; font-size: 10.5px; font-weight: 600; fill: #8b949e; letter-spacing: 1px; }
    .hires-txt { font-family: "Fira Code", "Ubuntu Mono", monospace; font-size: 9px; font-weight: 700; fill: #fbbf24; letter-spacing: 0.6px; }
    .spec-txt { font-family: "Fira Code", "Ubuntu Mono", monospace; font-size: 9.5px; font-weight: 600; fill: #8ECAE6; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #e6edf3; }
    .artist { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #8ECAE6; }
  </style>

  
  <rect x="1" y="1" width="818" height="114" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5" />

  
  <g transform="translate(96, 58)">
    <g class="vinyl">
      <circle cx="0" cy="0" r="34" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
      <circle cx="0" cy="0" r="27" fill="none" stroke="#21262d" stroke-width="1.2" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#21262d" stroke-width="1.2" />
      <circle cx="0" cy="0" r="12" fill="#fbbf24" opacity="0.85" />
      <circle cx="0" cy="0" r="3.5" fill="#0d1117" />
      <line x1="0" y1="-27" x2="0" y2="-18" stroke="#8ECAE6" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>

  
  <g clip-path="url(#album-clip)">
    <rect x="18" y="18" width="80" height="80" fill="url(#cover-bg)" />
    <circle cx="58" cy="58" r="26" fill="#0d1117" fill-opacity="0.55" stroke="#8ECAE6" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="58" cy="58" r="21" fill="none" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4.5" />
    
    <line x1="58" y1="58" x2="58" y2="43" stroke="#e6edf3" stroke-width="2" stroke-linecap="round" />
    <line x1="58" y1="58" x2="70" y2="63" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="58" cy="58" r="2.5" fill="#8ECAE6" />
  </g>
  <rect x="18" y="18" width="80" height="80" rx="10" fill="none" stroke="#30363d" stroke-width="1.5" />

  
  <circle class="dot" cx="152" cy="27" r="3.5" fill="#57da69" />
  <text x="162" y="31" class="meta">NOW PLAYING</text>

  
  <rect x="256" y="19" width="48" height="16" rx="4" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="1" />
  <text x="280" y="30" text-anchor="middle" class="hires-txt">HI-RES</text>

  
  <rect x="310" y="19" width="150" height="16" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="385" y="30" text-anchor="middle" class="spec-txt">FLAC · 24-bit / 96 kHz</text>

  
  <text x="148" y="60" class="title">1998</text>
  <text x="148" y="80" class="artist">Lamp · Her Watch (2018)</text>

  
  <g transform="translate(148, 94)">
    <rect x="0" y="0" width="375" height="3.5" rx="1.75" fill="#21262d" />
    <rect class="prog" x="0" y="0" width="375" height="3.5" rx="1.75" fill="url(#bar-grad)" />
  </g>

  
  <text x="791" y="31" text-anchor="end" class="meta">LOSSLESS · STEREO</text>

  
  <g fill="url(#eq-grad)">
    <g transform="translate(566, 97)"><rect class="b1" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(576, 97)"><rect class="b2" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(586, 97)"><rect class="b3" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(596, 97)"><rect class="b4" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(606, 97)"><rect class="b5" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(616, 97)"><rect class="b6" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(626, 97)"><rect class="b2" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(636, 97)"><rect class="b4" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(646, 97)"><rect class="b1" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(656, 97)"><rect class="b5" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(666, 97)"><rect class="b3" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(676, 97)"><rect class="b6" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(686, 97)"><rect class="b1" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(696, 97)"><rect class="b4" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(706, 97)"><rect class="b2" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(716, 97)"><rect class="b6" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(726, 97)"><rect class="b3" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(736, 97)"><rect class="b5" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(746, 97)"><rect class="b1" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(756, 97)"><rect class="b4" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(766, 97)"><rect class="b2" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(776, 97)"><rect class="b5" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
    <g transform="translate(786, 97)"><rect class="b3" x="0" y="-48" width="5" height="48" rx="2.5" /></g>
  </g>
</svg>
