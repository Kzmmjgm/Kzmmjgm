<svg xmlns="http://www.w3.org/2000/svg" width="820" height="115" viewBox="0 0 820 115">
  <defs>
    <clipPath id="footer-clip">
      <rect x="0" y="0" width="820" height="115" rx="10" />
    </clipPath>

    <linearGradient id="aurora-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ECAE6" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#8ECAE6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="aurora-mint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57da69" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#57da69" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="train-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="fade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1" />
    </linearGradient>
  </defs>

  <style>
    @keyframes auroraA {
      0%, 100% { transform: translateX(0px) translateY(0px); opacity: 0.85; }
      50% { transform: translateX(35px) translateY(-4px); opacity: 1; }
    }
    @keyframes auroraB {
      0%, 100% { transform: translateX(0px) translateY(0px); opacity: 0.7; }
      50% { transform: translateX(-40px) translateY(3px); opacity: 1; }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.2; }
    }
    @keyframes winBlink {
      0%, 78%, 100% { opacity: 0.9; }
      84%, 92% { opacity: 0.15; }
    }
    @keyframes trainRun {
      0% { transform: translateX(-180px); }
      100% { transform: translateX(880px); }
    }

    .aur-a { animation: auroraA 9s ease-in-out infinite; }
    .aur-b { animation: auroraB 12s ease-in-out infinite; }
    .tw1 { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.5s ease-in-out infinite 1.1s; }
    .wb1 { animation: winBlink 6s ease-in-out infinite; }
    .wb2 { animation: winBlink 8.5s ease-in-out infinite 2.5s; }
    .train { animation: trainRun 14s linear infinite; }
  </style>

  <g clip-path="url(#footer-clip)">
    
    <rect x="0" y="0" width="820" height="115" fill="#0d1117" />

    
    <g class="aur-a">
      <path d="M -80 42 Q 90 12 250 38 T 580 28 T 900 44 L 900 115 L -80 115 Z" fill="url(#aurora-blue)" />
    </g>
    <g class="aur-b">
      <path d="M -80 56 Q 140 28 330 52 T 660 36 T 900 54 L 900 115 L -80 115 Z" fill="url(#aurora-mint)" />
    </g>

    
    <g fill="#8ECAE6">
      <circle class="tw1" cx="72" cy="20" r="1.3" />
      <circle class="tw2" cx="164" cy="14" r="1.5" />
      <circle class="tw1" cx="286" cy="24" r="1.1" fill="#e6edf3" />
      <circle class="tw2" cx="395" cy="12" r="1.6" />
      <circle class="tw1" cx="512" cy="21" r="1.2" fill="#57da69" />
      <circle class="tw2" cx="638" cy="15" r="1.4" fill="#e6edf3" />
      <circle class="tw1" cx="744" cy="22" r="1.5" />
      <path class="tw2" d="M 455 12 Q 455 16 459 16 Q 455 16 455 20 Q 455 16 451 16 Q 455 16 455 12 Z" fill="#8ECAE6" />
      <path class="tw1" d="M 218 19 Q 218 22 221 22 Q 218 22 218 25 Q 218 22 215 22 Q 218 22 218 19 Z" fill="#57da69" />
    </g>

    
    <path d="M 0 115 L 0 82 L 38 82 L 38 68 L 62 68 L 62 78 L 95 78 L 95 58 L 122 58 L 122 76 L 160 76 L 160 50 L 188 50 L 188 70 L 230 70 L 230 62 L 260 62 L 260 80 L 310 80 L 310 46 L 342 46 L 342 66 L 388 66 L 388 74 L 430 74 L 430 52 L 462 52 L 462 72 L 515 72 L 515 44 L 548 44 L 548 68 L 592 68 L 592 58 L 626 58 L 626 78 L 675 78 L 675 54 L 708 54 L 708 72 L 758 72 L 758 64 L 792 64 L 792 82 L 820 82 L 820 115 Z" fill="#121821" />

    
    <path d="M 0 115 L 0 92 L 54 92 L 54 74 L 84 74 L 84 86 L 132 86 L 132 66 L 164 66 L 164 84 L 210 84 L 210 72 L 246 72 L 246 88 L 288 88 L 288 60 L 320 60 L 320 82 L 365 82 L 365 68 L 404 68 L 404 86 L 452 86 L 452 62 L 488 62 L 488 82 L 538 82 L 538 58 L 570 58 L 570 84 L 615 84 L 615 70 L 654 70 L 654 88 L 702 88 L 702 66 L 736 66 L 736 86 L 784 86 L 784 76 L 820 76 L 820 115 Z" fill="#161b22" />

    
    <g>
      <rect x="64" y="80" width="3" height="4" fill="#fde68a" opacity="0.7" />
      <rect x="72" y="80" width="3" height="4" fill="#8ECAE6" opacity="0.6" />
      <rect x="142" y="72" width="3" height="4" fill="#8ECAE6" opacity="0.8" />
      <rect x="150" y="72" width="3" height="4" fill="#fde68a" opacity="0.5" />
      <rect class="wb1" x="142" y="80" width="3" height="4" fill="#fde68a" />
      <rect x="220" y="78" width="3" height="4" fill="#57da69" opacity="0.7" />
      <rect x="298" y="67" width="3" height="4" fill="#fde68a" opacity="0.85" />
      <rect x="306" y="67" width="3" height="4" fill="#8ECAE6" opacity="0.75" />
      <rect class="wb2" x="298" y="76" width="3" height="4" fill="#8ECAE6" />
      <rect x="376" y="74" width="3" height="4" fill="#fde68a" opacity="0.65" />
      <rect x="462" y="69" width="3" height="4" fill="#8ECAE6" opacity="0.85" />
