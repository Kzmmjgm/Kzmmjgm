      <rect x="462" y="78" width="3" height="4" fill="#57da69" opacity="0.6" />
      <rect x="548" y="65" width="3" height="4" fill="#fde68a" opacity="0.8" />
      <rect x="556" y="65" width="3" height="4" fill="#8ECAE6" opacity="0.7" />
      <rect x="548" y="74" width="3" height="4" fill="#8ECAE6" opacity="0.5" />
      <rect class="wb2" x="626" y="76" width="3" height="4" fill="#fde68a" />
      <rect x="712" y="72" width="3" height="4" fill="#8ECAE6" opacity="0.8" />
      <rect x="720" y="72" width="3" height="4" fill="#fde68a" opacity="0.65" />
    </g>

    
    <g stroke="#21262d" stroke-width="1.5">
      <line x1="0" y1="101" x2="820" y2="101" stroke="#30363d" stroke-width="2" />
      <line x1="80" y1="102" x2="80" y2="115" />
      <line x1="190" y1="102" x2="190" y2="115" />
      <line x1="300" y1="102" x2="300" y2="115" />
      <line x1="410" y1="102" x2="410" y2="115" />
      <line x1="520" y1="102" x2="520" y2="115" />
      <line x1="630" y1="102" x2="630" y2="115" />
      <line x1="740" y1="102" x2="740" y2="115" />
    </g>

    
    <g class="train">
      
      <polygon points="124,93 174,86 174,100 124,98" fill="url(#train-beam)" />

      
      <rect x="0" y="90" width="38" height="10" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <rect x="4" y="92.5" width="6" height="4" rx="0.8" fill="#8ECAE6" opacity="0.9" />
      <rect x="13" y="92.5" width="6" height="4" rx="0.8" fill="#fde68a" opacity="0.9" />
      <rect x="22" y="92.5" width="6" height="4" rx="0.8" fill="#8ECAE6" opacity="0.85" />
      <rect x="31" y="92.5" width="4" height="4" rx="0.8" fill="#fde68a" opacity="0.7" />
      
      <circle cx="0.8" cy="96" r="1.4" fill="#f87171" />

      
      <rect x="38" y="93" width="4" height="5" fill="#0f172a" />

      
      <rect x="42" y="90" width="38" height="10" rx="2" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <rect x="46" y="92.5" width="6" height="4" rx="0.8" fill="#fde68a" opacity="0.95" />
      <rect x="55" y="92.5" width="6" height="4" rx="0.8" fill="#8ECAE6" opacity="0.9" />
      <rect x="64" y="92.5" width="6" height="4" rx="0.8" fill="#fde68a" opacity="0.85" />
      <rect x="73" y="92.5" width="4" height="4" rx="0.8" fill="#57da69" opacity="0.85" />

      
      <rect x="80" y="93" width="4" height="5" fill="#0f172a" />

      
      <path d="M 84 90 L 118 90 Q 124 90 125 96 L 125 100 L 84 100 Z" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <rect x="88" y="92.5" width="6" height="4" rx="0.8" fill="#8ECAE6" opacity="0.95" />
      <rect x="97" y="92.5" width="6" height="4" rx="0.8" fill="#fde68a" opacity="0.95" />
      <rect x="106" y="92.5" width="6" height="4" rx="0.8" fill="#8ECAE6" opacity="0.9" />
      <rect x="115" y="92.5" width="6" height="3.8" rx="1" fill="#e0f2fe" opacity="0.95" />
      
      <circle cx="124.2" cy="97.2" r="1.6" fill="#fef08a" />
    </g>

    
    <line x1="0" y1="114" x2="820" y2="114" stroke="#8ECAE6" stroke-opacity="0.18" stroke-width="1" />

    
    <rect x="0" y="0" width="70" height="115" fill="url(#fade-left)" />
    <rect x="750" y="0" width="70" height="115" fill="url(#fade-right)" />
  </g>
</svg>
